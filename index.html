<script>
const S={brand:'\uD83C\uDFA3 \uB09A\uC2DC\uC758 \uC2E0',badge:'\uB09A\uC2DC \uC548\uC804 \uB3C4\uC6B0\uBBF8',title:'\uC624\uB298, \uC5EC\uAE30\uC11C<br>\uB09A\uC2DC\uD574\uB3C4 \uB420\uAE4C\uC694?',sub:'\uADDC\uC815\uBD80\uD130 \uBC14\uB2E4 \uC0C1\uD0DC\uAE4C\uC9C0 \uD55C \uBC88\uC5D0 \uD655\uC778\uD558\uC138\uC694.',loc:'\uB09A\uC2DC \uAD6C\uC5ED: \uBD80\uC0B0\uAD11\uC5ED\uC2DC \uC5F0\uC548',check:'\uD3EC\uD68D \uD310\uC815',area:'\uB09A\uC2DC \uAD6C\uC5ED',weather:'\uBC14\uB2E4 \uB0A0\uC528',fortune:'\uC6B4\uC138 \uCD94\uCC9C'};

iv class="card"><h2>\uD83C\uDFB2 \uC624\uB298\uC758 \uB09A\uC2DC \uC6B4\uC138</h2><p id="fortuneText">\uBC84\uD2BC\uC744 \uB20C\uB7EC \uC624\uB298\uC758 \uD589\uC6B4\uC744 \uD655\uC778\uD558\uC138\uC694.</p><button class="primary" onclick="draw()">\uC6B4\uC138 \uBF51\uAE30</button></div><div class="card"><h2>\uD589\uC6B4 \uC5B4\uC885</h2><div class="result"><div class="symbol">\u2728</div><div><b id="luckyFish">-</b><small id="luckyTime">-</small></div></div></div></section>';
function view(id,b){document.querySelectorAll('.page').forEach(x=>x.hidden=x.id!==id);document.querySelectorAll('.tab').forEach(x=>x.classList.remove('on'));b.classList.add('on')}

function draw(){var messages=['\uC88B\uC740 \uD3EC\uC778\uD2B8\uB97C \uBC1C\uACAC\uD560 \uC218 \uC788\uB294 \uB0A0\uC785\uB2C8\uB2E4.','\uCC44\uBE44\uB97C \uAC04\uACB0\uD558\uAC8C \uC900\uBE44\uD574 \uBCF4\uC138\uC694.','\uCC9C\uCC9C\uD788 \uD0D0\uC0C9\uD558\uBA74 \uC88B\uC740 \uC785\uC9C8\uC774 \uC62C \uC218 \uC788\uC5B4\uC694.','\uBC14\uB2E4\uC758 \uD750\uB984\uC744 \uB290\uAE0B\uBA70 \uCC9C\uCC9C\uD788 \uC904\uC744 \uB4DC\uB9AC\uC6CC \uBCF4\uC138\uC694.','\uC624\uB298\uC740 \uC870\uAE09\uD568\uBCF4\uB2E4 \uC778\uB0B4\uAC00 \uD589\uC6B4\uC744 \uBD80\uB985\uB2C8\uB2E4.','\uB3D9\uB8CC\uC640 \uC815\uBCF4\uB97C \uB098\uB204\uBA74 \uB354 \uC990\uAC70\uC6B4 \uCD9C\uC870\uAC00 \uB429\uB2C8\uB2E4.','\uD3C9\uC18C\uC640 \uB2E4\uB978 \uCC44\uBE44\uB97C \uC2DC\uB3C4\uD574 \uBCFC \uC88B\uC740 \uD0C0\uC774\uBC0D\uC785\uB2C8\uB2E4.','\uD3C9\uC628\uD55C \uBC14\uB2E4\uAC00 \uC88B\uC740 \uC18C\uC2DD\uC744 \uAC00\uC838\uB2E4\uC904 \uC218 \uC788\uC5B4\uC694.'];var times=['06:00-08:00','08:00-10:00','10:00-12:00','14:00-16:00','15:00-17:00','17:00-19:00'];var pool=fish.map(x=>x[0]).sort(function(){return Math.random()-.5});var count=Math.floor(Math.random()*2)+2;fortuneText.textContent=messages[Math.floor(Math.random()*messages.length)];luckyFish.textContent='\uD589\uC6B4 \uC5B4\uC885: '+pool.slice(0,count).join(', ');luckyTime.textContent='\uCD94\uCC9C \uC2DC\uAC04\uB300: '+times[Math.floor(Math.random()*times.length)]}

document.querySelector('#weather .grid').insertAdjacentHTML('beforeend','<div class="metric"><span>\uC2DC\uC815</span><b>10 km</b><em>\uC591\uD638</em></div><div class="metric"><span>\uC2B5\uB3C4</span><b>68%</b><em>\uBCF4\uD1B5</em></div>');
document.getElementById('fortune').insertAdjacentHTML('beforeend','<div class="card warn"><h2>\uC6B4\uC138 \uC548\uB0B4</h2><p>\uC6B4\uC138\uB294 \uC990\uAC70\uC6B4 \uCD9C\uC870\uB97C \uC704\uD55C \uCC38\uACE0 \uC815\uBCF4\uC785\uB2C8\uB2E4. \uC2E4\uC81C \uCD9C\uC870 \uC804\uC5D0\uB294 \uD30C\uACE0, \uD48D\uC18D, \uC870\uC11D\uACFC \uB0DA\uC2DC \uADDC\uC815\uC744 \uAF2D \uD655\uC778\uD558\uC138\uC694.</p></div>');
document.querySelector('.badge').style.cursor='pointer';
document.querySelector('.badge').onclick=function(){var p=document.getElementById('safetyInfo');if(!p){p=document.createElement('div');p.id='safetyInfo';p.style.cssText='position:fixed;z-index:9;left:50%;top:50%;transform:translate(-50%,-50%);width:min(88vw,390px);padding:22px;border-radius:17px;background:#fff;color:#173740;box-shadow:0 14px 45px #001b2c66';p.innerHTML='<h2 style="margin:0 0 13px;font-size:19px">\uD83E\uDDBA \uB0DA\uC2DC \uC548\uC804 \uC218\uCE59</h2><p style="line-height:1.75;font-size:14px">1. \uAD6C\uBA85\uC870\uB07C\uB97C \uBC18\uB4DC\uC2DC \uCC29\uC6A9\uD558\uC138\uC694.<br>2. \uD48D\uC18D\uACFC \uD30C\uACE0 \uC608\uBCF4\uB97C \uC218\uC2DC\uB85C \uD655\uC778\uD558\uC138\uC694.<br>3. \uBC29\uD30C\uC81C\uC640 \uAC2F\uBC14\uC704\uC5D0\uC11C\uB294 \uBBF8\uB044\uB7FC\uC5D0 \uC8FC\uC758\uD558\uC138\uC694.<br>4. \uC5B4\uB450\uC6CC\uC9C0\uAE30 \uC804\uC5D0 \uC548\uC804\uD55C \uC7A5\uC18C\uB85C \uC774\uB3D9\uD558\uC138\uC694.</p><button class="primary" onclick="document.getElementById(\'safetyInfo\').remove()">\uD655\uC778\uD588\uC5B4\uC694</button>';document.body.appendChild(p)}else p.remove()};
document.getElementById('fortune').insertAdjacentHTML('afterbegin','<div class="card" style="background:linear-gradient(135deg,#e9faf7,#f8ffec)"><p style="margin:0;font-size:15px;line-height:1.75;color:#245f5d">\uC624\uB298\uB3C4 \uBB34\uB9AC\uD558\uC9C0 \uC54A\uACE0, \uC548\uC804\uD558\uAC8C \uC990\uAE30\uBA70 \uC88B\uC740 \uC785\uC9C8\uC744 \uB9CC\uB098\uC138\uC694. \uD589\uC6B4\uC740 \uC900\uBE44\uB41C \uB0DA\uC2DC\uC778\uC5D0\uAC8C \uCC3E\uC544\uC635\uB2C8\uB2E4. \u2728</p></div>');
var typoWalker=document.createTreeWalker(document.body,NodeFilter.SHOW_TEXT),typoNode;while(typoNode=typoWalker.nextNode()){typoNode.nodeValue=typoNode.nodeValue.replace(/\uB0DA/g,'\uB09A')}
async function refreshMarineWeather(lat,lon){
  try{
    var marineUrl='https://marine-api.open-meteo.com/v1/marine?latitude='+lat+'&longitude='+lon+'&current=wave_height,wave_period,ocean_current_velocity&cell_selection=sea';
    var airUrl='https://api.open-meteo.com/v1/forecast?latitude='+lat+'&longitude='+lon+'&current=wind_speed_10m,visibility,relative_humidity_2m&timezone=auto';
    var response=await Promise.all([fetch(marineUrl),fetch(airUrl)]);
    var marine=await response[0].json(),air=await response[1].json();
    var values=document.querySelectorAll('#weather .metric b');
    if(values.length>=4){values[0].textContent=(marine.current.wave_height||0).toFixed(1)+' m';values[1].textContent=(air.current.wind_speed_10m||0).toFixed(1)+' km/h';values[2].textContent=Math.round((air.current.visibility||0)/1000)+' km';values[3].textContent=(air.current.relative_humidity_2m||0)+'%';if(values[4])values[4].textContent=(marine.current.ocean_current_velocity||0).toFixed(1)+' km/h';if(values[5])values[5].textContent=(marine.current.wave_period||0).toFixed(1)+' s';updateFishingScore(marine.current.wave_height||0,air.current.wind_speed_10m||0,marine.current.ocean_current_velocity||0,marine.current.wave_period||0)}
    document.querySelector('.loc').innerHTML='<i class="dot"></i>\uD604\uC7AC \uC704\uCE58 \uAE30\uC900: '+lat.toFixed(3)+', '+lon.toFixed(3);
    var stamp=document.getElementById('weatherUpdate');if(!stamp){stamp=document.createElement('p');stamp.id='weatherUpdate';stamp.style.cssText='font-size:11px;color:#688188;margin:12px 0 0';document.querySelector('#weather .card').appendChild(stamp)}stamp.textContent='\uD604\uC7AC \uC704\uCE58 \uAE30\uC900 \uC5C5\uB370\uC774\uD2B8: '+new Date().toLocaleTimeString('ko-KR',{hour:'2-digit',minute:'2-digit'})+' (30\uBD84\uB9C8\uB2E4 \uC790\uB3D9 \uAC31\uC2E0)';
  }catch(e){console.warn('Weather update unavailable',e)}
}
function updateFishingScore(wave,wind,current,period){var score=100;score-=Math.min(45,wave*35);score-=Math.min(35,wind*2);score-=Math.min(15,current*4);if(period>=9&&wave>=0.8)score-=15;score=Math.max(0,Math.round(score));var level=score>=75?'\uC88B\uC74C':score>=50?'\uC8FC\uC758':'\uBE44\uCD94\uCC9C',color=score>=75?'#16a56d':score>=50?'#e39d37':'#dc625b',advice=score>=75?'\uCD08\uBCF4\uC790\uB3C4 \uAE30\uC0C1\uBCC0\uD654\uC640 \uD604\uC7A5 \uC0C1\uD669\uC744 \uD655\uC778\uD558\uBA70 \uCD9C\uC870\uD558\uC138\uC694.':score>=50?'\uD30C\uB3C4\uB098 \uBC14\uB78C\uC774 \uB2E4\uC18C \uC788\uC2B5\uB2C8\uB2E4. \uBC29\uD30C\uC81C\u00B7\uAC2F\uBC14\uC704 \uB0DA\uC2DC\uB294 \uD2B9\uD788 \uC8FC\uC758\uD558\uC138\uC694.':'\uCD08\uBCF4\uC790 \uB0DA\uC2DC\uB294 \uBBF8\uB8E8\uB294 \uAC83\uC744 \uAD8C\uD569\uB2C8\uB2E4. \uD604\uC7A5 \uD1B5\uC81C\uC640 \uD2B9\uBCF4\uB97C \uD655\uC778\uD558\uC138\uC694.';var box=document.getElementById('fishingScore');if(!box){box=document.createElement('div');box.id='fishingScore';box.className='result';document.querySelector('#weather .card').appendChild(box)}box.style.background=score>=75?'#edfcf4':score>=50?'#fff8e9':'#fff0ef';box.innerHTML='<div class="symbol" style="background:'+color+'">'+score+'</div><div><b>\uB0DA\uC2DC \uC801\uD569\uB3C4 '+score+'\uC810 · '+level+'</b><small>'+advice+'</small></div>'}
function startWeatherUpdates(){
  if(!navigator.geolocation)return;
  navigator.geolocation.getCurrentPosition(function(p){var lat=p.coords.latitude,lon=p.coords.longitude;refreshMarineWeather(lat,lon);setInterval(function(){refreshMarineWeather(lat,lon)},1800000)},function(){console.warn('Location permission was not granted')},{enableHighAccuracy:false,timeout:10000,maximumAge:1800000});
}
startWeatherUpdates();

  ];
  function distance(a,b,c,d){var r=Math.PI/180,x=(c-a)*r,y=(d-b)*r;var q=Math.sin(x/2)**2+Math.cos(a*r)*Math.cos(c*r)*Math.sin(y/2)**2;return 6371000*2*Math.atan2(Math.sqrt(q),Math.sqrt(1-q));}

  function evaluatePosition(lat,lng){renderZones();var nearest=controlZones.map(function(z){return {name:z[0],meters:distance(lat,lng,z[1],z[2])};}).sort(function(a,b){return a.meters-b.meters})[0],status=document.getElementById('zoneStatus');if(!status)return;var near=nearest.meters<=300;status.innerHTML='<div class="symbol" style="background:'+(near?'#dc625b':'#16a56d')+'">'+(near?'!':'✓')+'</div><div><b>'+(near?'낚시통제구역 인근입니다':'통제구역 참고 위치에서 벗어났습니다')+'</b><small>가장 가까운 참고 지점: '+nearest.name+' ('+Math.round(nearest.meters)+'m). '+(near?'현장 표지판을 확인하고 낚시를 피하세요.':'허용구역의 법적 확정 판정은 아닙니다. 현장 표지판과 최신 고시를 확인하세요.')+'</small></div>';status.style.background=near?'#fff0ef':'#edfcf4';}
